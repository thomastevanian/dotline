name: Screenshots

# Boots an Android emulator, installs the debug build, drives the launcher and publishes real
# screenshots to the "ci-shots" branch (one forced commit, so the history never grows).
# Run it from the Actions tab, or add [shots] to a commit message on a claude/** branch.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]

permissions:
  contents: write

jobs:
  shots:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[shots]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          add-job-summary: never

      - name: Enable hardware acceleration (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the debug APK
        run: ./gradlew --console=plain assembleDebug

      - name: Download the previous release (for the upgrade test)
        run: curl -fsSL -o old.apk "https://github.com/${GITHUB_REPOSITORY}/releases/download/v1.0.18/Dotline.apk" || rm -f old.apk

      - name: Pillow for image resizing
        run: python3 -m pip install --quiet pillow

      - name: Run the emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          heap-size: 512M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/emu_shots.sh

      - name: Publish screenshots to ci-shots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          [ -d shots ] || { echo "no shots directory"; exit 0; }
          echo "run ${{ github.run_number }} sha ${GITHUB_SHA::7} branch ${GITHUB_REF_NAME}" > shots/RUN.txt
          rm -rf /tmp/cishots && mkdir /tmp/cishots && cp -r shots/. /tmp/cishots/ && cd /tmp/cishots || exit 0
          git init -q
          git checkout -q --orphan ci-shots
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "screenshots of run ${{ github.run_number }}"
          git push -q -f origin ci-shots 2>&1 | tail -2
          exit 0
